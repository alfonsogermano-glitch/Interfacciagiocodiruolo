# Independent staging-only gateway. Does not publish 80/443, mount production
# web assets, or modify/recreate the public Caddy/cloudflared containers.
name: hollowgate-staging-private-edge
services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - /opt/hollowgate/staging-trial/Caddyfile.staging-isolated:/etc/caddy/Caddyfile:ro
      - /opt/hollowgate-staging-auth-web:/srv/auth-preview:ro
      - /opt/hollowgate/staging-trial/vtt-pilot:/srv/vtt-pilot:ro
      - shared_staging_certs:/origin-cert:ro
    secrets:
      - auth_trial_hash
    networks:
      - auth_staging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,size=8m
      - /config:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=8m

secrets:
  auth_trial_hash:
    file: /opt/hollowgate/config/auth_trial_hash
volumes:
  shared_staging_certs:
    external: true
    name: hollowgate-staging-edge_caddy_data
networks:
  auth_staging:
    external: true
    name: hollowgate-auth-staging_default
