name: hollowgate-staging
services:
  frontend:
    build:
      context: ../..
      dockerfile: Dockerfile.aruba
    restart: unless-stopped
    ports:
      # Staging is local to the VPS, not publicly exposed before TLS/reverse proxy.
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
