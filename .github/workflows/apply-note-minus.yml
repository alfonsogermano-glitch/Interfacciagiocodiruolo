name: Apply Note Minus Icon

on:
  push:
    branches:
      - ui/note-horizontal-rule-minus
    paths:
      - .github/workflows/apply-note-minus.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/note-horizontal-rule-minus
      - name: Replace horizontal rule icon
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/components/session/shared/RichTextEditor.tsx')
          source = path.read_text()
          assert source.count('SeparatorHorizontal') == 2, source.count('SeparatorHorizontal')
          source = source.replace('SeparatorHorizontal', 'Minus')
          assert source.count('SeparatorHorizontal') == 0
          assert source.count('Minus') >= 2
          path.write_text(source)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/session/shared/RichTextEditor.tsx
          git commit -m "ui: use Minus for note horizontal rule"
          git push origin HEAD:ui/note-horizontal-rule-minus
