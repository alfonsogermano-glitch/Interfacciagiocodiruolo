name: P2B2 Recharts RED

on:
  push:
    branches:
      - hardening/p2b-bundle-recharts3

permissions:
  contents: read

jobs:
  recharts-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve Recharts 3 candidate
        run: npm install --save-exact recharts@3.10.1
      - name: Security gate on candidate
        run: npm audit --audit-level=high
      - name: Capture expected TypeScript RED
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee p2b2-recharts-red.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected Recharts 3 migration typecheck to fail before wrapper migration, but it passed."
            exit 1
          fi
          echo "Expected RED captured with exit code $code."
      - uses: actions/upload-artifact@v4
        with:
          name: p2b2-recharts-candidate
          path: |
            package.json
            package-lock.json
            p2b2-recharts-red.log
          if-no-files-found: error
