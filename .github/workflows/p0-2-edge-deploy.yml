name: P0.2 Edge Deploy

on:
  push:
    paths:
      - '.github/workflows/p0-2-edge-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/stabilization/p0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/p0
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy make-server-771c5bfd
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy make-server-771c5bfd --project-ref njcnkovruynhtsgzgrxi
