name: P0.2 Adventure Source Patch

on:
  push:
    paths:
      - '.github/workflows/p0-2-adventure-source-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/stabilization/p0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/p0
          fetch-depth: 0
      - name: Apply deterministic adventure persistence patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/types/character.ts',
              "  description?: string;\n\n  // Ambiti\n",
              "  description?: string;\n\n  // Ambito narrativo: null/assente = tutta la campagna.\n  adventureId?: string | null;\n\n  // Ambiti\n",
          )

          replace_once(
              'src/services/supabase/charactersService.ts',
              "    portraitAssetId: row.portrait_asset_id ?? undefined,\n",
              "    portraitAssetId: row.portrait_asset_id ?? undefined,\n    adventureId: row.adventure_id ?? null,\n",
          )

          replace_once(
              'src/services/supabase/charactersService.ts',
              "    portrait_asset_id: character.portraitAssetId ?? null,\n",
              "    portrait_asset_id: character.portraitAssetId ?? null,\n    adventure_id: character.adventureId ?? null,\n",
          )

          replace_once(
              'src/services/supabase/charactersService.ts',
              "      portraitCropArea: character.portraitCropArea ?? null,\n      portraitFrameAssetId:",
              "      portraitCropArea: character.portraitCropArea ?? null,\n      adventureId: character.adventureId ?? null,\n      portraitFrameAssetId:",
          )

          replace_once(
              'supabase/functions/server/index.tsx',
              "    portraitImageUrl, portraitSourceImageUrl, portraitCropArea,\n    portraitFrameAssetId, portraitFrameRotationDegrees,",
              "    portraitImageUrl, portraitSourceImageUrl, portraitCropArea, adventureId,\n    portraitFrameAssetId, portraitFrameRotationDegrees,",
          )

          replace_once(
              'supabase/functions/server/index.tsx',
              "      portrait_crop_area: portraitCropArea ?? null,\n      portrait_frame_asset_id:",
              "      portrait_crop_area: portraitCropArea ?? null,\n      adventure_id: adventureId ?? null,\n      portrait_frame_asset_id:",
          )

          sql = Path('supabase-add-character-adventure.sql')
          if sql.exists():
              raise SystemExit('supabase-add-character-adventure.sql already exists unexpectedly')
          sql.write_text("""-- P0.2: PG -> Avventura. NULL significa \"tutta la campagna\".\n-- Additivo e idempotente; nessun dato PG esistente viene modificato.\n\nalter table public.characters\n  add column if not exists adventure_id uuid;\n\ndo $$\nbegin\n  if not exists (\n    select 1\n    from pg_constraint\n    where conname = 'characters_adventure_id_fkey'\n      and conrelid = 'public.characters'::regclass\n  ) then\n    alter table public.characters\n      add constraint characters_adventure_id_fkey\n      foreign key (adventure_id)\n      references public.adventures(id)\n      on delete set null;\n  end if;\nend $$;\n\ncreate index if not exists idx_characters_adventure\n  on public.characters(adventure_id);\n""", encoding='utf-8')
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/character.ts src/services/supabase/charactersService.ts supabase/functions/server/index.tsx supabase-add-character-adventure.sql
          git diff --cached --check
          git commit -m "fix: restore character adventure persistence contract"
          git push origin HEAD:stabilization/p0
