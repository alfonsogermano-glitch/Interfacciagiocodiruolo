name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack local workspace
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/note-tables'
        run: tar --exclude=.git -czf /tmp/hollowgate-note-tables-workspace.tgz .
      - name: Upload local workspace
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/note-tables'
        uses: actions/upload-artifact@v4
        with:
          name: hollowgate-note-tables-workspace
          path: /tmp/hollowgate-note-tables-workspace.tgz
          retention-days: 1
      - run: node scripts/verify-fire-animation.mjs
      - run: node scripts/verify-ice-skin-consistency.mjs
      - run: node scripts/verify-ice-animation.mjs
      - run: node scripts/verify-lightning-skin-consistency.mjs
      - run: node scripts/verify-poison-skin-consistency.mjs
      - run: node scripts/verify-poison-polish.mjs
      - run: node scripts/verify-stone-skin-consistency.mjs
      - run: node scripts/verify-stone-animation.mjs
      - run: node scripts/verify-metal-skin-consistency.mjs
      - run: node scripts/verify-metal-animation.mjs
      - run: node scripts/verify-vercel-preview-policy.mjs
      - run: node scripts/verify-dice-skin-regressions.mjs
      - run: npm run verify:dice-surface-profiles
      - run: npm run check
      - run: npm audit --audit-level=high
