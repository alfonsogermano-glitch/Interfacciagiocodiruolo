name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Generate dice 3D lockfile
        if: github.ref == 'refs/heads/feat/dice-system'
        run: npm install --package-lock-only --ignore-scripts --save-exact @3d-dice/dice-box-threejs@0.0.12
      - name: Upload dice 3D lockfile
        if: github.ref == 'refs/heads/feat/dice-system'
        uses: actions/upload-artifact@v4
        with:
          name: hollowgate-dice-3d-lockfile
          path: package-lock.json
          retention-days: 1
      - run: npm ci
      - name: Pack local workspace
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/note-tables'
        run: tar --exclude=.git -czf /tmp/hollowgate-note-tables-workspace.tgz .
      - name: Upload local workspace
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/note-tables'
        uses: actions/upload-artifact@v4
        with:
          name: hollowgate-note-tables-workspace
          path: /tmp/hollowgate-note-tables-workspace.tgz
          retention-days: 1
      - run: npm audit --audit-level=high
      - run: npm run check
