name: Chat security draft checks
on:
  push:
    branches:
      - docs/ovh-staging-launch-plan
  pull_request:
    paths:
      - 'src/services/supabase/chatService.ts'
      - 'src/app/components/session/SessionChatPanel.tsx'
      - 'scripts/verify-chat-reactions.mjs'
      - 'tests/security/**'
      - '.github/workflows/chat-security-draft.yml'
jobs:
  chat-static-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chat broadcast regressions
        run: |
          node tests/security/verify-chat-reaction-broadcast.mjs
          node tests/security/verify-chat-delete-broadcast.mjs
      - name: Existing chat reaction checks
        run: node scripts/verify-chat-reactions.mjs
