name: Aruba API staging
on:
  push:
    branches:
      - feature/aruba-api-foundation
    paths:
      - 'apps/aruba-api/**'
      - 'apps/aruba-auth-web/**'
      - 'apps/aruba-vtt-pilot/**'
      - 'deploy/aruba/**'
      - '.github/workflows/aruba-api.yml'
  pull_request:
    paths:
      - 'apps/aruba-api/**'
      - 'apps/aruba-auth-web/**'
      - 'apps/aruba-vtt-pilot/**'
      - 'deploy/aruba/**'
      - '.github/workflows/aruba-api.yml'

jobs:
  auth-web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check browser JavaScript syntax
        run: |
          node --check apps/aruba-auth-web/flow.mjs
          node --check apps/aruba-auth-web/app.mjs
      - name: Test isolated auth browser flows
        run: node --test apps/aruba-auth-web/test/*.test.mjs
      - name: Test and build isolated Aruba React VTT lobby
        working-directory: apps/aruba-vtt-pilot
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
          test -f ../../deploy/aruba/dist/vtt-pilot/index.html
          # Ensure theme spacing variables survive Vite/Tailwind production build.
          css_file="$(find ../../deploy/aruba/dist/vtt-pilot/assets -name '*.css' -print -quit)"
          test -n "$css_file"
          grep -Fq -- '--spacing:' "$css_file"
          grep -Fq -- '.gap-4' "$css_file"
          grep -Fq -- '.p-4' "$css_file"
          if grep -R -i -l 'supabase\.co' ../../deploy/aruba/dist/vtt-pilot; then
            echo "Unexpected legacy backend inside Aruba pilot bundle" >&2
            exit 1
          fi
      - name: Validate Caddy staging configuration syntax
        run: |
          docker run --rm -v "$PWD/deploy/aruba/Caddyfile.staging:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Validate password-gated Caddy trial syntax
        run: |
          mkdir -p "$RUNNER_TEMP/trial"
          printf 'tester %s\n' '$2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG' > "$RUNNER_TEMP/trial/hash"
          docker run --rm \
            -v "$PWD/deploy/aruba/Caddyfile.auth-trial:/etc/caddy/Caddyfile:ro" \
            -v "$RUNNER_TEMP/trial/hash:/run/secrets/auth_trial_hash:ro" \
            caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Verify Caddy accepts the expected secret and rejects wrong credentials
        run: |
          cat > "$RUNNER_TEMP/trial/Caddyfile" <<'EOF'
          :8080 {
            basic_auth bcrypt {
              import /run/secrets/auth_trial_hash
            }
            respond "private" 200
          }
          EOF
          docker run -d --name hollowgate-basic-auth-ci -p 127.0.0.1:18080:8080 \
            -v "$RUNNER_TEMP/trial/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$RUNNER_TEMP/trial/hash:/run/secrets/auth_trial_hash:ro" \
            caddy:2.10.2-alpine
          for i in $(seq 1 20); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)" = 401 ]; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u tester:hiccup http://127.0.0.1:18080/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -u tester:wrong http://127.0.0.1:18080/)" = 401

  api-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/aruba-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: bash -n ../../deploy/aruba/scripts/test-auth-e2e.sh
      - run: bash -n ../../deploy/aruba/scripts/test-password-reset-e2e.sh
      - run: bash -n ../../deploy/aruba/scripts/test-signup-e2e.sh
      - run: bash -n ../../deploy/aruba/scripts/prepare-auth-trial.sh
      - run: python3 -m unittest discover -s ../../deploy/aruba/scripts/tests -p "test_*.py"
      - run: docker build -t hollowgate-aruba-api:test .
      - name: Runtime smoke test with a rootless UID and a 0600 database secret
        run: |
          mkdir -p "$RUNNER_TEMP/hg-secret"
          printf '%s' 'example-not-a-real-secret' > "$RUNNER_TEMP/hg-secret/password"
          chmod 600 "$RUNNER_TEMP/hg-secret/password"
          sudo chown 1001:1001 "$RUNNER_TEMP/hg-secret/password"
          docker run -d --name hollowgate-aruba-smoke \
            --user 1001:1001 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e PGHOST=127.0.0.1 -e PGUSER=hollowgate \
            -e PGDATABASE=hollowgate \
            -e POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password \
            -v "$RUNNER_TEMP/hg-secret/password:/run/secrets/postgres_password:ro" \
            -p 127.0.0.1:13002:3000 hollowgate-aruba-api:test
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:13002/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs hollowgate-aruba-smoke
          exit 1

  auth-schema-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated PostgreSQL 17
        run: |
          docker run -d --name hg-auth-test -e POSTGRES_PASSWORD=ci-only-password -e POSTGRES_DB=hollowgate_test postgres:17
          for i in $(seq 1 30); do
            if docker exec hg-auth-test psql -U postgres -d hollowgate_test -Atqc 'SELECT 1' 2>/dev/null | grep -qx 1; then
              sleep 3
              if docker exec hg-auth-test psql -U postgres -d hollowgate_test -Atqc 'SELECT 1' 2>/dev/null | grep -qx 1; then exit 0; fi
            fi
            sleep 1
          done
          exit 1
      - name: Apply schema to disposable database
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/001_auth_foundation.sql
      - name: Verify auth schema isolation and migration-safe identity constraints
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/test_auth_foundation.sql
      - name: Install session schema
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/002_auth_sessions.sql
      - name: Verify session constraints and revocation
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/test_auth_sessions.sql
      - name: Install password-action schema
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/003_password_actions.sql
      - name: Verify reset tokens are expiring, single-use, and private
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/test_password_actions.sql
      - name: Install abuse-control counters
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/004_auth_rate_limits.sql
      - name: Verify rate-limit table is private and increments atomically
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/test_auth_rate_limits.sql
      - name: Verify PostgreSQL session lookup and revocation
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/test_session_repository.sql
      - name: Install restricted API role
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/005_auth_runtime_role.sql
      - name: Verify restricted role permits login and denies privilege escalation
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/test_auth_runtime_role.sql
      - name: Install staging-only password-reset grants
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/006_password_reset_runtime.sql
      - name: Verify reset permissions cannot change users or roles
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/test_password_reset_runtime.sql

      - name: Install local signup verification functions
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/007_signup_verification.sql
      - name: Verify restricted signup and one-time email confirmation
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/test_signup_verification.sql
      - name: Apply staging-native VTT campaign schema
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/008_vtt_campaigns.sql
      - name: Apply campaign update migration
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/009_vtt_campaign_updates.sql
      - name: Install character draft storage
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/010_vtt_character_drafts.sql
      - name: Install full original character sheet storage
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/011_vtt_character_sheets.sql
      - name: Install owner-only character archive
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/012_vtt_character_archive.sql
      - name: Verify character draft isolation
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/test_vtt_character_drafts.sql
      - name: Verify owner isolation and restricted campaign privileges
        run: |
          docker exec -i hg-auth-test psql -v ON_ERROR_STOP=1 -U postgres -d hollowgate_test < deploy/aruba/sql/test_vtt_campaigns.sql

  backup-restore-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable PostgreSQL 17
        run: |
          docker run -d --name hg-postgres-backup-ci \
            -e POSTGRES_USER=hollowgate \
            -e POSTGRES_PASSWORD=ci-only-password \
            -e POSTGRES_DB=hollowgate postgres:17
          for i in $(seq 1 30); do
            if docker exec hg-postgres-backup-ci psql -U hollowgate -d hollowgate -Atqc 'SELECT 1' 2>/dev/null | grep -qx 1; then
              sleep 3
              if docker exec hg-postgres-backup-ci psql -U hollowgate -d hollowgate -Atqc 'SELECT 1' 2>/dev/null | grep -qx 1; then exit 0; fi
            fi
            sleep 1
          done
          exit 1
      - name: Seed disposable data
        run: |
          docker exec hg-postgres-backup-ci psql -v ON_ERROR_STOP=1 -U hollowgate -d hollowgate -c \
            "CREATE TABLE backup_canary(id int primary key, label text not null); INSERT INTO backup_canary VALUES (1,'restored');"
      - name: Run backup and test-restore script
        env:
          HG_POSTGRES_CONTAINER: hg-postgres-backup-ci
          HG_BACKUP_DIR: ${{ runner.temp }}/verified-backup
        run: |
          bash deploy/aruba/scripts/backup-and-verify.sh
          test "$(find "$HG_BACKUP_DIR" -maxdepth 1 -name '*.dump' | wc -l)" -eq 1
      - name: Verify the original database remains untouched
        run: |
          docker exec hg-postgres-backup-ci psql -v ON_ERROR_STOP=1 -U hollowgate -d hollowgate -Atqc \
            "SELECT label FROM backup_canary WHERE id=1" | grep -Fx restored
          test "$(docker exec hg-postgres-backup-ci psql -U hollowgate -d hollowgate -Atqc \
            "SELECT count(*) FROM pg_database WHERE datname LIKE 'hg_restore_check_%'")" -eq 0
