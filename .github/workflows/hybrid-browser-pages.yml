name: Hybrid Browser Demo - GitHub Pages (isolated)
on:
  push:
    branches:
      - experimental/hybrid-gm-host-spike
    paths:
      - 'experimental/hybrid/web-demo/**'
      - '.github/workflows/hybrid-browser-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hybrid-pages-demo
  cancel-in-progress: true
jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the static preview contains no production secrets
        run: |
          node --test experimental/hybrid/web-demo/demo.test.mjs
          ! grep -E 'SUPABASE_SERVICE_ROLE_KEY|VITE_SUPABASE_ANON_KEY' experimental/hybrid/web-demo/demo.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: experimental/hybrid/web-demo
      - id: deploy
        uses: actions/deploy-pages@v4
