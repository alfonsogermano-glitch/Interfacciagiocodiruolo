name: P0 lockfile bootstrap

on:
  push:
    branches:
      - stabilization/p0

permissions:
  contents: write

jobs:
  baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/p0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck > p0-typecheck-diagnostics.txt 2>&1
          status=$?
          echo "TYPECHECK_EXIT_CODE=$status" >> p0-typecheck-diagnostics.txt
          cat p0-typecheck-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p0-typecheck-diagnostics.txt
          if ! git diff --cached --quiet; then
            git commit -m "test: update P0 TypeScript diagnostics [skip ci]"
            git push origin HEAD:stabilization/p0
          fi
          exit "$status"
