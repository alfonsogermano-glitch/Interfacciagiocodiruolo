name: P0 lockfile bootstrap

on:
  push:
    branches:
      - stabilization/p0

permissions:
  contents: write

jobs:
  baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/p0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize lockfile
        shell: bash
        run: npm install --package-lock-only --ignore-scripts
      - name: Capture clean-install and TypeScript baseline
        shell: bash
        run: |
          set +e
          : > p0-typecheck-diagnostics.txt

          echo "=== npm ci ===" >> p0-typecheck-diagnostics.txt
          npm ci >> p0-typecheck-diagnostics.txt 2>&1
          ci_status=$?
          echo "NPM_CI_EXIT_CODE=$ci_status" >> p0-typecheck-diagnostics.txt

          if [ "$ci_status" -eq 0 ]; then
            echo "" >> p0-typecheck-diagnostics.txt
            echo "=== npm run typecheck ===" >> p0-typecheck-diagnostics.txt
            npm run typecheck >> p0-typecheck-diagnostics.txt 2>&1
            typecheck_status=$?
          else
            typecheck_status=99
            echo "" >> p0-typecheck-diagnostics.txt
            echo "Typecheck skipped because npm ci failed." >> p0-typecheck-diagnostics.txt
          fi

          echo "TYPECHECK_EXIT_CODE=$typecheck_status" >> p0-typecheck-diagnostics.txt
          cat p0-typecheck-diagnostics.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json p0-typecheck-diagnostics.txt
          if ! git diff --cached --quiet; then
            git commit -m "test: capture P0 TypeScript baseline [skip ci]"
            git push origin HEAD:stabilization/p0
          fi

          if [ "$ci_status" -ne 0 ]; then
            exit "$ci_status"
          fi
          exit "$typecheck_status"
