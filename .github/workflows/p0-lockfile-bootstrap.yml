name: P0 final baseline

on:
  push:
    branches:
      - stabilization/p0

permissions:
  contents: write

jobs:
  baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/p0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Align legacy local character contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/services/supabase/charactersService.ts')
          text = path.read_text()
          old = 'ownerProfileId?: string; ruleset: RulesetId | null})[]> {'
          new = 'ownerProfileId?: string; ruleset?: RulesetId | null})[]> {'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one character contract occurrence, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/supabase/charactersService.ts
          git commit -m "fix: align local character ruleset contract [skip ci]"
          git push origin HEAD:stabilization/p0
      - name: Verify typecheck and build
        shell: bash
        run: |
          set +e
          : > p0-verification.txt
          npm run typecheck >> p0-verification.txt 2>&1
          typecheck_status=$?
          echo "TYPECHECK_EXIT_CODE=$typecheck_status" >> p0-verification.txt
          npm run build >> p0-verification.txt 2>&1
          build_status=$?
          echo "BUILD_EXIT_CODE=$build_status" >> p0-verification.txt
          cat p0-verification.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p0-verification.txt
          git commit -m "test: record P0.1 verification [skip ci]"
          git push origin HEAD:stabilization/p0
          if [ "$typecheck_status" -ne 0 ]; then exit "$typecheck_status"; fi
          exit "$build_status"
