name: Apply Note Tables Integration

on:
  push:
    branches:
      - feature/note-tables
    paths:
      - .github/workflows/apply-note-tables-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/note-tables
      - name: Apply exact RichTextEditor integration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/components/session/shared/RichTextEditor.tsx')
          source = path.read_text()

          old = "Newspaper, type LucideIcon } from 'lucide-react';"
          new = "Newspaper, Table2, type LucideIcon } from 'lucide-react';"
          assert source.count(old) == 1, source.count(old)
          source = source.replace(old, new)

          old = "import { InlineCheckbox } from './tiptapInlineCheckbox';\nimport { ICON_CATEGORIES } from './tiptapIconData';"
          new = "import { InlineCheckbox } from './tiptapInlineCheckbox';\nimport { NOTE_TABLE_EXTENSIONS } from './tiptapNoteTable';\nimport { NoteTableToolbar } from './NoteTableToolbar';\nimport { ICON_CATEGORIES } from './tiptapIconData';"
          assert source.count(old) == 1, source.count(old)
          source = source.replace(old, new)

          old = '''        <ToolbarButton disabled={!editable} label="Linea orizzontale" active={false} onClick={() => runCommand(() => editor.chain().focus().setHorizontalRule().run())}><SeparatorHorizontal className="h-4 w-4" /></ToolbarButton>\n        <ToolbarButton disabled={!editable} label="Attività"'''
          new = '''        <ToolbarButton disabled={!editable} label="Linea orizzontale" active={false} onClick={() => runCommand(() => editor.chain().focus().setHorizontalRule().run())}><SeparatorHorizontal className="h-4 w-4" /></ToolbarButton>\n        <ToolbarButton disabled={!editable || editor.isActive('table')} label="Tabella" active={false} onClick={() => runCommand(() => editor.chain().focus().insertNoteTable().run())}><Table2 className="h-4 w-4" /></ToolbarButton>\n        <ToolbarButton disabled={!editable} label="Attività"'''
          assert source.count(old) == 1, source.count(old)
          source = source.replace(old, new)

          old = '''      inlineCheckboxExtension,\n      ...TIPTAP_BLOCK_EXTENSIONS,\n    ],'''
          new = '''      inlineCheckboxExtension,\n      ...TIPTAP_BLOCK_EXTENSIONS,\n      ...NOTE_TABLE_EXTENSIONS,\n    ],'''
          assert source.count(old) == 1, source.count(old)
          source = source.replace(old, new)

          old = '''        <EditorContent editor={editor} />\n      </div>\n    </div>'''
          new = '''        <EditorContent editor={editor} />\n      </div>\n      <NoteTableToolbar editor={editor} editable={editable} />\n    </div>'''
          assert source.count(old) == 1, source.count(old)
          source = source.replace(old, new)

          path.write_text(source)
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/session/shared/RichTextEditor.tsx
          git commit -m "feat: integrate tables into note editor"
          git push origin HEAD:feature/note-tables
