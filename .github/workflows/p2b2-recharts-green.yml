name: P2B2 Recharts GREEN

on:
  push:
    branches:
      - hardening/p2b-bundle-recharts3
  pull_request:

permissions:
  contents: write

jobs:
  recharts-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Stop after candidate is committed
        id: state
        shell: bash
        run: |
          version=$(node -p "require('./package.json').dependencies.recharts")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "3.10.1" ]; then
            echo "already_committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_committed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.state.outputs.already_committed == 'false'
        run: npm ci
      - if: steps.state.outputs.already_committed == 'false'
        name: Resolve exact Recharts 3 candidate
        run: npm install --save-exact recharts@3.10.1
      - if: steps.state.outputs.already_committed == 'false'
        name: Migrate shared chart wrapper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/components/ui/chart.tsx')
          text = path.read_text()

          old = 'import * as RechartsPrimitive from "recharts";\n'
          new = '''import * as RechartsPrimitive from "recharts";\nimport type {\n  LegendPayload,\n  TooltipContentProps,\n  TooltipValueType,\n} from "recharts";\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '}: React.ComponentProps<typeof RechartsPrimitive.Tooltip> &\n  React.ComponentProps<"div"> & {'
          new = '}: TooltipContentProps<TooltipValueType, string | number> &\n  React.ComponentProps<"div"> & {'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    const value =\n      !labelKey && typeof label === "string"\n        ? config[label as keyof typeof config]?.label || label\n        : itemConfig?.label;'''
          new = '''    const value =\n      !labelKey && (typeof label === "string" || typeof label === "number")\n        ? config[String(label) as keyof typeof config]?.label || label\n        : itemConfig?.label;'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = 'formatter(item.value, item.name, item, index, item.payload)'
          new = 'formatter(item.value, item.name, item, index, payload)'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''}: React.ComponentProps<"div"> &\n  Pick<RechartsPrimitive.LegendProps, "payload" | "verticalAlign"> & {\n    hideIcon?: boolean;\n    nameKey?: string;\n  }) {'''
          new = '''}: React.ComponentProps<"div"> & {\n  payload?: ReadonlyArray<LegendPayload>;\n  verticalAlign?: "top" | "middle" | "bottom";\n  hideIcon?: boolean;\n  nameKey?: string;\n}) {'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - if: steps.state.outputs.already_committed == 'false'
        name: Inventory chart wrapper usage
        shell: bash
        run: |
          grep -R "ChartTooltipContent" -n src || true
          grep -R "ChartLegendContent" -n src || true
          grep -R "recharts/\(lib\|es6\|types\)/" -n src && exit 1 || true
      - if: steps.state.outputs.already_committed == 'false'
        name: Security gate
        run: npm audit --audit-level=high
      - if: steps.state.outputs.already_committed == 'false'
        name: TypeScript GREEN
        run: npm run typecheck
      - if: steps.state.outputs.already_committed == 'false'
        name: Full project GREEN
        run: npm run check
      - if: steps.state.outputs.already_committed == 'false'
        name: Diff validation
        shell: bash
        run: |
          git diff --check
          git diff -- package.json package-lock.json src/app/components/ui/chart.tsx
      - if: github.event_name == 'push' && steps.state.outputs.already_committed == 'false'
        name: Commit verified Recharts migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/app/components/ui/chart.tsx
          git commit -m "perf: migrate charts to Recharts 3"
          git push origin HEAD:hardening/p2b-bundle-recharts3
