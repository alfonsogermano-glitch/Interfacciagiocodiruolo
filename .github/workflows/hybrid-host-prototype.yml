name: Hybrid GM Host isolated prototype
on:
  push:
    branches:
      - experimental/hybrid-gm-host-spike
    paths:
      - 'experimental/hybrid/**'
      - '.github/workflows/hybrid-host-prototype.yml'
  pull_request:
    paths:
      - 'experimental/hybrid/**'
      - '.github/workflows/hybrid-host-prototype.yml'
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test per-campaign permissions and local persistence without Supabase
        run: node --test experimental/hybrid/host-core.test.mjs
