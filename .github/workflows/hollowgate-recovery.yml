name: Hollowgate Supabase Recovery
on:
  push:
    branches: [experimental/hybrid-gm-host-spike]
    paths:
      - 'src/main.tsx'
      - 'src/app/recovery/**'
      - 'scripts/verify-supabase-recovery.mts'
      - '.github/workflows/hollowgate-recovery.yml'
  pull_request:
    paths:
      - 'src/main.tsx'
      - 'src/app/recovery/**'
      - 'scripts/verify-supabase-recovery.mts'
      - '.github/workflows/hollowgate-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recovery behavior tests
        run: node --experimental-strip-types --test scripts/verify-supabase-recovery.mts
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Vite build
        run: npm run build
