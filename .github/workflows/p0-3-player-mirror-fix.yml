name: P0.3 Player Campaign Mirror Fix

on:
  push:
    paths:
      - '.github/workflows/p0-3-player-mirror-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/stabilization/p0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/p0
          fetch-depth: 0
      - name: Apply deterministic rollback mirror fix
        shell: python
        run: |
          from pathlib import Path

          p = Path('supabase/functions/server/index.tsx')
          text = p.read_text(encoding='utf-8')

          anchor = '''async function getInviteMembershipSql(code: string): Promise<CampaignMembership | null> {\n'''
          helper = '''async function mirrorPlayerCampaignsKv(profileId: string): Promise<void> {\n  // Snapshot di rollback soltanto: la relazione canonica resta campaign_members.\n  // Derivandolo da SQL dopo la scrittura evitiamo che un nuovo join lasci\n  // playerCampaigns:* indietro rispetto allo stato reale.\n  const canonical = await getPlayerCampaignsSql(profileId);\n  await kv.set(playerCampaignsKey(profileId), canonical);\n}\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'helper anchor count={text.count(anchor)}')
          text = text.replace(anchor, helper + anchor, 1)

          old = '''  const playerCampaigns = await campaignStore.get(playerCampaignsKey(profileId)) ?? [];\n  if (!playerCampaigns.some((pc: any) => pc.campaignId === campaignId)) {\n    playerCampaigns.push({ campaignId, ownerId });\n    await campaignStore.set(playerCampaignsKey(profileId), playerCampaigns);\n  }\n'''
          new = '''  await mirrorPlayerCampaignsKv(profileId);\n'''
          if text.count(old) != 1:
              raise SystemExit(f'addPlayer mirror block count={text.count(old)}')
          text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
      - name: Verify before commit
        run: |
          npm ci
          npm run check
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/server/index.tsx
          git commit -m "fix: keep rollback player campaign snapshot in sync"
          git push origin HEAD:stabilization/p0
