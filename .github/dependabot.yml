version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      tiptap-security:
        patterns:
          - '@tiptap/*'
        update-types:
          - minor
          - patch
      vite-security:
        patterns:
          - 'vite'
          - '@vitejs/*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'chore(deps)'
