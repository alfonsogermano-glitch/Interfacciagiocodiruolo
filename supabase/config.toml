# Synthetic-only Supabase CLI stack; NOT the production schema or production deployment.
# Review CLI support and localhost Docker networking before first start.
project_id = "hollowgate-local-staging"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

# Deliberately no functions, migrations, production buckets or application secrets yet.
